---
# Shared audit collection printer.
# Prints the final runtime collection name, count, and operator-facing object
# labels without executing any BIG-IP modules.

- name: Build audit labels for {{ audit_collection_name }}
  ansible.builtin.set_fact:
    _audit_collection_labels: "{{ (audit_collection_items | default([])) | map('audit_object_label') | list }}"

- name: Print audit summary for {{ audit_collection_name }}
  ansible.builtin.debug:
    msg:
      - "{{ audit_phase }} {{ audit_collection_name }}: count={{ (audit_collection_items | default([])) | length }}"
      - "Items: {{ _audit_collection_labels | join('; ') if _audit_collection_labels else 'none' }}"
  when:
    - (audit_show_empty | default(false)) or ((audit_collection_items | default([])) | length > 0)

