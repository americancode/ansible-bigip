# Shared target filter.
# Evaluates host/group selector targeting, emits matched/skipped subsets, and logs a concise targeting summary.

# Targeting defaults to match-only mode unless selectors are present on the object;
# this keeps untagged canonical objects backward-compatible during host-specific runs.
- name: Evaluate {{ target_filter_object_label | default(object_label) }} targeting for the current inventory host
  ansible.builtin.set_fact:
    _prep_targeted_objects: >-
      {{
        source_objects | default([])
        | split_targeted_objects(
            inventory_hostname,
            group_names | default([]),
            target_filter_match_without_selectors | default(match_without_selectors | default(true))
          )
      }}

- name: Publish targeted {{ target_filter_object_label | default(object_label) }} collections
  ansible.builtin.set_fact:
    "{{ matched_var }}": "{{ _prep_targeted_objects.matched }}"
    "{{ skipped_var }}": "{{ _prep_targeted_objects.skipped }}"
    "{{ summary_var }}": "{{ _prep_targeted_objects }}"

- name: Log {{ target_filter_object_label | default(object_label) }} targeting summary
  ansible.builtin.debug:
    msg:
      - "{{ target_filter_object_label | default(object_label) }} targeting for {{ inventory_hostname }}: matched={{ (_prep_targeted_objects.matched | default([])) | length }}, skipped={{ (_prep_targeted_objects.skipped | default([])) | length }}"
      - "Matched: {{ (_prep_targeted_objects.matched_labels | default([])) | join('; ') if (_prep_targeted_objects.matched_labels | default([])) else 'none' }}"
      - "Skipped: {{ (_prep_targeted_objects.skipped_labels | default([])) | join('; ') if (_prep_targeted_objects.skipped_labels | default([])) else 'none' }}"
  when:
    - ((_prep_targeted_objects.matched | default([])) | length) > 0
      or ((_prep_targeted_objects.skipped | default([])) | length) > 0
