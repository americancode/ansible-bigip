# GTM repo LTM virtual build tasks.
# Runtime effect: classify built repo-known LTM virtual servers into runtime collections for GTM member resolution.

# The repo-known virtual map is a read-only input used by GTM compilers for virtual-server
# name-to-address inference during pool/member resolution.
- name: Classify repo-known LTM virtual server operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: repo-known LTM virtual server
    active_objects: "{{ repo_ltm_virtual_servers | default([]) }}"
    deletion_objects: []
    delete_var: repo_ltm_virtual_servers_delete
    present_var: repo_ltm_virtual_servers_present

- name: Classify repo-known LTM inline virtual-server intent operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: repo-known LTM inline virtual-server intent
    active_objects: "{{ repo_ltm_inline_virtual_server_intents | default([]) }}"
    deletion_objects: []
    delete_var: repo_ltm_inline_virtual_server_intents_delete
    present_var: repo_ltm_inline_virtual_server_intents_present

- name: Build repo-known LTM inline intent virtual servers
  ansible.builtin.import_tasks: "{{ playbook_dir }}/gtm/prep/intents/inline/build-repo-ltm-inline-virtual-server-intents.yml"

- name: Build repo-known LTM virtual server lookup
  ansible.builtin.set_fact:
    # Build a stable lookup by `/partition/name` for fast resolution of intent and pool members.
    repo_ltm_virtual_server_lookup: >-
      {{
        repo_ltm_virtual_server_lookup | default({}) | combine({
          ('/' ~ (item.partition | default('Common')) ~ '/' ~ item.name): {
            'destination': item.destination,
            'destination_port': item.destination_port
          }
        })
      }}
  loop: "{{ repo_ltm_virtual_servers_present | default([]) }}"
  when:
    - item.name is defined
    - item.destination is defined
    - item.destination_port is defined
