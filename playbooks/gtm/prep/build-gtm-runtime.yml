# GTM runtime build tasks.
# Runtime effect: classify canonical GTM objects into delete/present runtimes and merge intent-built lookup collections.

# Canonical GTM collections are classified first so intent expansion can safely merge
# into the same present/delete buckets expected by runtime apply/delete tasks.
- name: Classify GTM datacenter operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: GTM datacenter
    active_objects: "{{ gtm_datacenters | default([]) }}"
    deletion_objects: "{{ gtm_datacenter_deletions | default([]) }}"
    delete_var: gtm_datacenters_delete
    present_var: gtm_datacenters_present

- name: Classify GTM monitor operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: GTM monitor
    active_objects: "{{ gtm_monitors | default([]) }}"
    deletion_objects: "{{ gtm_monitor_deletions | default([]) }}"
    delete_var: gtm_monitors_delete
    present_var: gtm_monitors_present

- name: Classify GTM server operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: GTM server
    active_objects: "{{ gtm_servers | default([]) }}"
    deletion_objects: "{{ gtm_server_deletions | default([]) }}"
    delete_var: gtm_servers_delete
    present_var: gtm_servers_present

- name: Classify GTM pool operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: GTM pool
    active_objects: "{{ gtm_pools | default([]) }}"
    deletion_objects: "{{ gtm_pool_deletions | default([]) }}"
    delete_var: gtm_pools_delete
    present_var: gtm_pools_present

- name: Classify GTM Wide IP operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: GTM Wide IP
    active_objects: "{{ gtm_wide_ips | default([]) }}"
    deletion_objects: "{{ gtm_wide_ip_deletions | default([]) }}"
    delete_var: gtm_wide_ips_delete
    present_var: gtm_wide_ips_present

- name: Classify GTM topology region operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: GTM topology region
    active_objects: "{{ gtm_topology_regions | default([]) }}"
    deletion_objects: "{{ gtm_topology_region_deletions | default([]) }}"
    delete_var: gtm_topology_regions_delete
    present_var: gtm_topology_regions_present

- name: Classify GTM topology record operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: GTM topology record
    active_objects: "{{ gtm_topology_records | default([]) }}"
    deletion_objects: "{{ gtm_topology_record_deletions | default([]) }}"
    delete_var: gtm_topology_records_delete
    present_var: gtm_topology_records_present

- name: Publish canonical GTM datacenter operations
  # The rest of the runtime model expects datacenters under `gtm_canonical_*` keys.
  ansible.builtin.set_fact:
    gtm_canonical_datacenters_delete: "{{ gtm_datacenters_delete | default([]) }}"
    gtm_canonical_datacenters_present: "{{ gtm_datacenters_present | default([]) }}"

# Wide-IP intent shortcuts are merged after canonical classification so runtime still
# consumes a single canonical object model for all GTM object families.
- name: Build GTM Wide IP intent shortcuts
  ansible.builtin.import_tasks: "{{ playbook_dir }}/gtm/prep/intents/inline/build-wide-ip-intents.yml"
