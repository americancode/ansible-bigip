# LTM runtime build.
# Classifies explicit and intent-emitted LTM objects into deterministic present/delete execution sets.
- name: Classify LTM monitor operations
  ansible.builtin.import_tasks: "{{ playbook_dir }}/shared/prep/classify-operations.yml"
  vars:
    object_label: LTM monitor
    active_objects: "{{ ltm_monitors | default([]) }}"
    deletion_objects: "{{ ltm_monitor_deletions | default([]) }}"
    delete_var: ltm_monitors_delete
    present_var: ltm_monitors_present

