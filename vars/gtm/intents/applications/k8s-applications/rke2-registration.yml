---
# GTM intent for the RKE2 supervisor registration hostname.
# This file is part of the `k8s-applications` GTM intent category and is compiled by `playbooks/gtm/prep.yml`.
# It references canonical GTM servers in `vars/gtm/servers/regional-bigips.yml` and repo-known LTM virtual servers in:
# - `vars/ltm/intents/inline/k8s-clusters/rke2-east.yml`
# - `vars/ltm/intents/inline/k8s-clusters/rke2-west.yml`
# Supported fields:
# - Wide IP: `name`, `record_type`, `pool_lb_method`, `pools`
# - Inline pool: `name`, `preferred_lb_method`, `monitors`/`default_monitors`, `members`
# - Member ownership: `server_mode: reference` + `server`, or `server_mode: inline` + `server: {name, address/devices, datacenter_mode, ...}`
gtm_wide_ips:
  - name: "rke2-registration.platform.example.com"
    record_type: "a"
    pool_lb_method: "global-availability"
    pools:
      - name: "pool_rke2_registration_east"
        preferred_lb_method: "round-robin"
        monitors:
          - "registration_tcp"
        members:
          - server_mode: "reference"
            server: "bigip-east"
            virtual_server: "vs_rke2_east_registration_9345"
            address: "10.201.0.20"
            port: 9345
      - name: "pool_rke2_registration_west"
        preferred_lb_method: "round-robin"
        monitors:
          - "registration_tcp"
        members:
          - server_mode: "reference"
            server: "bigip-west"
            virtual_server: "vs_rke2_west_registration_9345"
            address: "10.202.0.20"
            port: 9345
