---
# GTM intent for the Kubernetes API hostname.
# This file is part of the `k8s-applications` GTM intent category and is compiled by `playbooks/gtm/prep.yml`.
# It references canonical GTM servers in `vars/gtm/servers/regional-bigips.yml` and repo-known LTM virtual servers in:
# - `vars/ltm/intents/clusters/rke2-east/platform-cluster.yml`
# - `vars/ltm/intents/clusters/rke2-west/platform-cluster.yml`
# Supported fields:
# - Wide IP: `name`, `record_type`, `pool_lb_method`, `pools`
# - Inline pool: `name`, `preferred_lb_method`, `monitors`/`default_monitors`, `members`
# - Member ownership: `server_mode: reference` + `server`, or `server_mode: inline` + `server: {name, address/devices, datacenter_mode, ...}`
gtm_wide_ips:
  - name: "rke2-api.platform.example.com"
    record_type: "a"
    pool_lb_method: "global-availability"
    pools:
      - name: "pool_rke2_api_east"
        preferred_lb_method: "round-robin"
        default_monitors:
          - "kubeapi_tcp"
        members:
          - server_mode: "reference"
            server: "bigip-east"
            virtual_server: "vs_rke2_east_kubeapi_6443"
            address: "10.201.0.20"
            port: 6443
      - name: "pool_rke2_api_west"
        preferred_lb_method: "round-robin"
        default_monitors:
          - "kubeapi_tcp"
        members:
          - server_mode: "reference"
            server: "bigip-west"
            virtual_server: "vs_rke2_west_kubeapi_6443"
            address: "10.202.0.20"
            port: 6443
