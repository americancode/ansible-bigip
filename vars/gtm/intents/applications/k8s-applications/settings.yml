---
# Shared settings for the Kubernetes application GTM intent category.
# Files under `vars/gtm/intents/applications/k8s-applications/` can embed GTM pools inline while inheriting
# shared defaults and monitor aliases from this directory.
gtm_application_intent_defaults:
  partition: "Common"
  enabled: true

gtm_pool_defaults:
  enabled: true
  alternate_lb_method: "round-robin"
  fallback_lb_method: "none"

gtm_member_defaults:
  enabled: true

# These aliases expand to repo-created GTM monitors in `vars/gtm/monitors/platform-monitors.yml`.
gtm_monitor_sets:
  kubeapi_tcp:
    - "/Common/mon_gtm_rke2_kubeapi_tcp"
  registration_tcp:
    - "/Common/mon_gtm_rke2_registration_tcp"
  argocd_https:
    - "/Common/mon_gtm_argocd_https"
  grafana_https:
    - "/Common/mon_gtm_grafana_https"
