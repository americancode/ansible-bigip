---
# Verbose/shared-object GTM application intent example.
# Each application intent references first-class GTM pools from `vars/gtm/pools/vm-applications.yml`.
# Those GTM pools then reference first-class GTM servers in `vars/gtm/servers/regional-bigips.yml`
# and repo-known LTM virtual servers in `vars/ltm/virtual_servers/vm-apps/business-apps.yml`.
gtm_application_intents:
  - name: "inventory.internal.example.com"
    record_type: "a"
    pool_lb_method: "topology"
    pools:
      - pool_mode: "reference"
        pool_ref: "pool_inventory_global"
        ratio: 1

  - name: "reporting.internal.example.com"
    record_type: "a"
    pool_lb_method: "topology"
    pools:
      - pool_mode: "reference"
        pool_ref: "pool_reporting_global"
        ratio: 1
