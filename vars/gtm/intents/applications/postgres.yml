---
# GTM application intent example for PostgreSQL service DNS.
# This file references `pool_pg_vm_global` from `vars/gtm/pools/postgres-vm-clusters.yml`.
# Supported fields: `name`, `record_type`, `pool_lb_method`, and `pools` (list of pool bindings with `pool_mode`, `pool_ref`, and optional `ratio`).
gtm_application_intents:
  - name: "postgres.internal.example.com"
    record_type: "a"
    pool_lb_method: "global-availability"
    pools:
      - pool_mode: "reference"
        pool_ref: "pool_pg_vm_global"
        ratio: 1
