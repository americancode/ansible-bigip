---
ltm_rke2_server_intents:
  - name: "rke2_west"
    services:
      - name: "kubeapi"
        virtual_server:
          name: "vs_rke2_west_kubeapi_6443"
          vip: "10.202.0.20"
          port: 6443
          description: "West region RKE2 Kubernetes API VIP"
        pool:
          name: "pool_rke2_west_kubeapi_6443"
          monitors:
            - "kubeapi_tcp"
          members:
            - host: "10.202.10.11"
              port: 6443
            - host: "10.202.10.12"
              port: 6443
            - host: "10.202.10.13"
              port: 6443

      - name: "registration"
        virtual_server:
          name: "vs_rke2_west_registration_9345"
          vip: "10.202.0.20"
          port: 9345
          description: "West region RKE2 supervisor registration VIP"
        pool:
          name: "pool_rke2_west_registration_9345"
          monitors:
            - "registration_tcp"
          members:
            - host: "10.202.10.11"
              port: 9345
            - host: "10.202.10.12"
              port: 9345
            - host: "10.202.10.13"
              port: 9345

      - name: "traefik"
        virtual_server:
          name: "vs_rke2_west_traefik_443"
          vip: "10.202.0.30"
          port: 443
          description: "West region Traefik ingress VIP"
        pool:
          name: "pool_rke2_west_traefik_443"
          monitors:
            - "traefik_https"
          members:
            - host: "10.202.20.21"
              port: 30443
            - host: "10.202.20.22"
              port: 30443
            - host: "10.202.20.23"
              port: 30443

      - name: "rancher"
        virtual_server:
          name: "vs_rke2_west_rancher_443"
          vip: "10.202.0.31"
          port: 443
          description: "West region Rancher management VIP"
        pool:
          name: "pool_rke2_west_rancher_443"
          monitors:
            - "/Common/https"
          members:
            - host: "10.202.20.21"
              port: 30444
            - host: "10.202.20.22"
              port: 30444
            - host: "10.202.20.23"
              port: 30444
